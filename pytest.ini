[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Coverage configuration
# Run: pytest --cov=app --cov-report=html --cov-report=term
# Or: pytest --cov=app --cov-report=html --cov-report=term-missing
addopts = 
    --strict-markers
    --tb=short
    -v

# Coverage options (uncomment to run coverage by default)
# addopts = 
#     --cov=app
#     --cov-report=html
#     --cov-report=term-missing
#     --cov-report=xml
#     --strict-markers
#     --tb=short
#     -v

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
